<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#103e39" />
    <title>Dashboard · Clinical QBank</title>
    <meta
      name="description"
      content="Browse clinical tests, build practice sessions and review your progress."
    />
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="icons.js"></script>
    <script defer src="question-tools.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a href="#content" class="skip">Skip to content</a>
    <div class="scrim" id="scrim" hidden></div>
    <aside id="sidebar">
      <a class="brand" href="#dashboard" aria-label="Clinical QBank dashboard"
        ><img src="assets/mark.svg" alt="" /><span
          >Clinical <b>QBank</b></span
        ></a
      >
      <nav aria-label="Main navigation">
        <p class="nav-label">Workspace</p>
        <div id="main-nav"></div>
        <div class="nav-rule"></div>
        <p class="nav-label">Library</p>
        <div id="library-nav"></div>
      </nav>
      <div class="side-foot">
        <div class="side-rule"></div>
        <button class="nav-btn" data-act="settings">
          <i data-icon="settings"></i>Display settings
        </button>
        <div class="profile">
          <span class="avatar"><i data-icon="user"></i></span
          ><span
            ><strong>Personal workspace</strong
            ><small>Private study space</small></span
          >
        </div>
      </div>
    </aside>
    <div id="workspace">
      <header class="topbar">
        <div class="crumb">
          <button
            class="icon-button mobile"
            id="menu"
            aria-label="Open navigation"
          >
            <i data-icon="menu"></i></button
          ><i data-icon="panel" class="desktop"></i
          ><span class="desktop">Workspace</span
          ><span class="slash desktop">/</span><b id="crumb">Dashboard</b>
        </div>
        <div class="toolbar">
          <button class="search-launch" data-act="search">
            <i data-icon="search"></i><span>Search bank...</span
            ><kbd>Ctrl K</kbd></button
          ><span class="tool-divider"></span
          ><button
            class="icon-button"
            data-act="theme"
            id="theme"
            aria-label="Switch to dark theme"
            title="Switch theme"
          >
            <i data-icon="moon"></i>
          </button>
        </div>
      </header>
      <main id="content" tabindex="-1">
        <div class="panel">Loading question bank…</div>
      </main>
    </div>
    <dialog id="dialog"><div id="modal"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
